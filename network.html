<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rellify • Network Test</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;background:#08090d;color:#fff;font-family:Segoe UI,Arial;display:grid;place-items:center;padding:20px;box-sizing:border-box}.card{width:min(700px,100%);background:#11131a;border:1px solid #292d3a;border-radius:24px;padding:30px;text-align:center;box-sizing:border-box}.back{display:block;text-align:left;color:#aaa;text-decoration:none;margin-bottom:20px}.logo{font-size:2.5rem;font-weight:800;background:linear-gradient(135deg,#ff0050,#8b5cf6,#00d9ff);-webkit-background-clip:text;color:transparent}.sub{color:#858b9b;margin:8px 0 30px}.speed{font-size:4rem;font-weight:800}.unit{color:#858b9b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:25px 0}.stat{background:#191c25;border:1px solid #292d3a;border-radius:14px;padding:18px}.stat b{font-size:1.2rem;display:block}.stat span{color:#858b9b;font-size:.8rem}.btn{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,#7c3aed,#2563eb);color:white;font-weight:800;font-size:1rem;cursor:pointer}.status{color:#858b9b;margin:18px 0;font-size:.85rem}@media(max-width:600px){.grid{grid-template-columns:1fr}.speed{font-size:3rem}}
:root{--bg:#0b0c0d;--card:#131516;--input:#1b1e1d;--border:#303633;--text:#f4f3ee;--muted:#9ba39d;--accent:#c8a96b;--sage:#8b9b86}
*{box-sizing:border-box}body{font-family:'DM Sans',sans-serif;background-image:radial-gradient(ellipse at 15% 4%,#c8a96b12,transparent 36%),radial-gradient(ellipse at 90% 90%,#8b9b8610,transparent 32%);color:var(--text)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.15;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:42px 42px}
.card{position:relative;overflow:hidden;background:var(--card);border-color:var(--border);border-radius:24px;box-shadow:0 24px 70px #0007;backdrop-filter:blur(18px);animation:riseIn .65s ease both;padding:32px}
.card:before{content:"";position:absolute;top:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,#e5c98b99,#8b9b8688,transparent)}
.back{color:var(--muted);font-size:.9rem;transition:color .2s}.back:hover{color:var(--accent)}
.logo{font-family:'Manrope',sans-serif;font-size:clamp(1.9rem,5vw,2.5rem);font-weight:800;letter-spacing:.04em;background:linear-gradient(120deg,#e5c98b,#c8a96b,#8b9b86);-webkit-background-clip:text}
.sub{font-size:.95rem;letter-spacing:.02em;margin-bottom:28px}
.speed{font-family:'Manrope',sans-serif;font-size:clamp(3.2rem,9vw,4.5rem);font-weight:800;letter-spacing:-.06em;background:linear-gradient(120deg,#f4f3ee,#c8a96b);-webkit-background-clip:text;color:transparent}
.unit{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase}
.grid{gap:12px;margin:25px 0}
.stat{position:relative;background:linear-gradient(140deg,#c8a96b0b,transparent 65%),var(--input);border:1px solid var(--border);border-radius:15px;padding:20px 14px;transition:transform .2s,border-color .2s}
.stat:hover{transform:translateY(-3px);border-color:#c8a96b88}
.stat b{font-family:'Manrope',sans-serif;font-size:1.15rem;color:var(--text);letter-spacing:-.025em}
.stat span{font-size:.7rem;letter-spacing:.13em;text-transform:uppercase}
.btn{position:relative;overflow:hidden;width:100%;padding:15px;border:1px solid #c8a96b66;border-radius:14px;background:linear-gradient(110deg,#d8bc7c,#b18e4c);color:#151611;font-family:'Manrope',sans-serif;font-weight:800;letter-spacing:.01em;cursor:pointer;transition:transform .2s,box-shadow .2s,filter .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px #c8a96b26;filter:brightness(1.05)}.btn:disabled{opacity:.65;cursor:wait;transform:none}
.status{padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--input);font-size:.85rem}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){.card{padding:23px 17px}.grid{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}}
</style></head><body><main class="card"><a class="back" href="index.html">← Kembali ke Rellify</a><div class="logo">⌁ Network Test</div><p class="sub">Ukur koneksi internet kamu dari browser</p><div class="speed" id="speed">—</div><div class="unit">Mbps download</div><div class="grid"><div class="stat"><b id="down">—</b><span>Download</span></div><div class="stat"><b id="up">—</b><span>Upload</span></div><div class="stat"><b id="ping">—</b><span>Ping</span></div></div><div class="status" id="status">Siap melakukan tes</div><button class="btn" id="start">↗ Mulai Tes</button></main><script type="module">import SpeedTest from 'https://esm.unpkg.com/@cloudflare/speedtest@1.13.1?target=es2022';const $=id=>document.getElementById(id);$('start').onclick=()=>{const b=$('start');b.disabled=true;b.textContent='◌ Sedang menguji...';$('status').textContent='Mengukur latency, download, dan upload...';try{const st=new SpeedTest({autoStart:false,measurements:[{type:'latency',numPackets:8},{type:'download',bytes:1e6,count:2},{type:'upload',bytes:1e6,count:2}]});st.onResultsChange=()=>{const d=st.results.getDownloadBandwidth(),u=st.results.getUploadBandwidth(),p=st.results.getUnloadedLatency();if(Number.isFinite(d)){$('down').textContent=(d/1e6).toFixed(1)+' Mbps';$('speed').textContent=(d/1e6).toFixed(1)}if(Number.isFinite(u))$('up').textContent=(u/1e6).toFixed(1)+' Mbps';if(Number.isFinite(p))$('ping').textContent=Math.round(p)+' ms'};st.onFinish=r=>{const d=r.getDownloadBandwidth(),u=r.getUploadBandwidth(),p=r.getUnloadedLatency();if(Number.isFinite(d)){$('down').textContent=(d/1e6).toFixed(1)+' Mbps';$('speed').textContent=(d/1e6).toFixed(1)}if(Number.isFinite(u))$('up').textContent=(u/1e6).toFixed(1)+' Mbps';if(Number.isFinite(p))$('ping').textContent=Math.round(p)+' ms';$('status').textContent='Test selesai — ✓';b.disabled=false;b.textContent='↻ Tes Lagi'};st.onError=e=>{$('status').textContent='Test gagal: '+e;b.disabled=false;b.textContent='🚀 Mulai Test'};st.play()}catch(e){$('status').textContent='Speed test gagal dimuat.';b.disabled=false;b.textContent='🚀 Mulai Test'}};</script></body></html>
