<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rellify • Network Test</title><style>body{margin:0;min-height:100vh;background:#08090d;color:#fff;font-family:Segoe UI,Arial;display:grid;place-items:center;padding:20px;box-sizing:border-box}.card{width:min(700px,100%);background:#11131a;border:1px solid #292d3a;border-radius:24px;padding:30px;text-align:center;box-sizing:border-box}.back{display:block;text-align:left;color:#aaa;text-decoration:none;margin-bottom:20px}.logo{font-size:2.5rem;font-weight:800;background:linear-gradient(135deg,#ff0050,#8b5cf6,#00d9ff);-webkit-background-clip:text;color:transparent}.sub{color:#858b9b;margin:8px 0 30px}.speed{font-size:4rem;font-weight:800}.unit{color:#858b9b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:25px 0}.stat{background:#191c25;border:1px solid #292d3a;border-radius:14px;padding:18px}.stat b{font-size:1.2rem;display:block}.stat span{color:#858b9b;font-size:.8rem}.btn{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,#7c3aed,#2563eb);color:white;font-weight:800;font-size:1rem;cursor:pointer}.status{color:#858b9b;margin:18px 0;font-size:.85rem}@media(max-width:600px){.grid{grid-template-columns:1fr}.speed{font-size:3rem}}</style></head><body><main class="card"><a class="back" href="index.html">← Kembali ke Rellify</a><div class="logo">📶 Network Test</div><p class="sub">Ukur koneksi internet kamu dari browser</p><div class="speed" id="speed">—</div><div class="unit">Mbps download</div><div class="grid"><div class="stat"><b id="down">—</b><span>Download</span></div><div class="stat"><b id="up">—</b><span>Upload</span></div><div class="stat"><b id="ping">—</b><span>Ping</span></div></div><div class="status" id="status">Siap melakukan tes</div><button class="btn" id="start">🚀 Mulai Test</button></main><script type="module">import SpeedTest from 'https://esm.unpkg.com/@cloudflare/speedtest@1.13.1?target=es2022';const $=id=>document.getElementById(id);$('start').onclick=()=>{const b=$('start');b.disabled=true;b.textContent='⏳ Testing...';$('status').textContent='Mengukur latency, download, dan upload...';try{const st=new SpeedTest({autoStart:false,measurements:[{type:'latency',numPackets:8},{type:'download',bytes:1e6,count:2},{type:'upload',bytes:1e6,count:2}]});st.onResultsChange=()=>{const d=st.results.getDownloadBandwidth(),u=st.results.getUploadBandwidth(),p=st.results.getUnloadedLatency();if(Number.isFinite(d)){$('down').textContent=(d/1e6).toFixed(1)+' Mbps';$('speed').textContent=(d/1e6).toFixed(1)}if(Number.isFinite(u))$('up').textContent=(u/1e6).toFixed(1)+' Mbps';if(Number.isFinite(p))$('ping').textContent=Math.round(p)+' ms'};st.onFinish=r=>{const d=r.getDownloadBandwidth(),u=r.getUploadBandwidth(),p=r.getUnloadedLatency();if(Number.isFinite(d)){$('down').textContent=(d/1e6).toFixed(1)+' Mbps';$('speed').textContent=(d/1e6).toFixed(1)}if(Number.isFinite(u))$('up').textContent=(u/1e6).toFixed(1)+' Mbps';if(Number.isFinite(p))$('ping').textContent=Math.round(p)+' ms';$('status').textContent='Test selesai ✓';b.disabled=false;b.textContent='🔄 Test Lagi'};st.onError=e=>{$('status').textContent='Test gagal: '+e;b.disabled=false;b.textContent='🚀 Mulai Test'};st.play()}catch(e){$('status').textContent='Speed test gagal dimuat.';b.disabled=false;b.textContent='🚀 Mulai Test'}};</script></body></html>
