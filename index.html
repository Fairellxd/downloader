<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#08090d"><title>Rellify</title>
<style>
:root{--bg:#0b0c0d;--card:#131516;--input:#1b1e1d;--border:#303633;--text:#f4f3ee;--muted:#9ba39d;--accent:#c8a96b;--danger:#ffaaa0}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Segoe UI,Arial,sans-serif;min-height:100vh;background:var(--bg);color:var(--text);padding:24px}body.light{--bg:#f4f3ed;--card:#fffefa;--input:#f0efe8;--border:#dedbd0;--text:#20231f;--muted:#72786f}.startup{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;transition:.5s}.startup.hide{opacity:0;visibility:hidden}.startup-inner{text-align:center}.startup-logo{font-size:2rem;font-weight:800;background:linear-gradient(120deg,#e5c98b,#c8a96b,#8b9b86);-webkit-background-clip:text;color:transparent}.startup-spinner,.spinner{width:42px;height:42px;margin:22px auto 12px;border:4px solid #282c37;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.startup-text{color:var(--muted);font-size:.85rem}.container{max-width:820px;margin:auto;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:30px;box-shadow:0 24px 70px #0007}.top{display:flex;justify-content:flex-end;gap:8px;margin-bottom:18px}.nav,.theme{border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer}.logo{text-align:center;margin-bottom:26px}.logo h1{font-size:2.5rem;background:linear-gradient(120deg,#e5c98b,#c8a96b,#8b9b86);-webkit-background-clip:text;color:transparent}.logo p{margin-top:8px;color:var(--muted);font-size:.9rem}.platform{width:100%;border:1px solid #303442;background:linear-gradient(120deg,#c8a96b,#a78b55);color:#fff;border-radius:13px;padding:13px;font-weight:700;margin-bottom:15px}.input-group{display:flex;gap:10px}.input-wrap{position:relative;flex:1}.input-wrap input{width:100%;height:52px;background:var(--input);color:var(--text);border:2px solid var(--border);border-radius:13px;padding:0 45px 0 16px;outline:none}.input-wrap input:focus{border-color:var(--accent)}.clear{position:absolute;right:8px;top:8px;height:36px;width:36px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:20px}.btn-process,.btn-download{border:0;border-radius:13px;color:#fff;font-weight:800;cursor:pointer}.btn-process{min-width:120px;background:linear-gradient(120deg,#d8bc7c,#b18e4c)}.paste{margin-top:9px;border:0;background:none;color:var(--accent);cursor:pointer;font-size:.82rem}.options{display:flex;margin-top:14px}.field{flex:1}.field label{display:block;color:var(--muted);font-size:.78rem;margin-bottom:7px}.field select{width:100%;background:var(--input);color:var(--text);border:1px solid var(--border);border-radius:11px;padding:12px}.loading{display:none;text-align:center;padding:25px 0;color:var(--muted)}.spinner{width:38px;height:38px}.progress{height:7px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:13px}.progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,#e5c98b,#c8a96b,#8b9b86);transition:.25s}.error{display:none;margin-top:18px;padding:14px 16px;border:1px solid #7f1d1d;background:#2a1116;color:var(--danger);border-radius:12px}.error.show{display:block}.result{display:none;margin-top:24px}.media-box{background:#090b10;border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:15px}.media-box video,.media-box audio{width:100%;display:block}.media-box video{max-height:560px}.audio-card{padding:24px}.audio-card .icon{text-align:center;font-size:2.5rem;margin-bottom:12px}.info{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 0;border-top:1px solid var(--border)}.title{min-width:0;flex:1}.title strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title span{display:block;margin-top:4px;color:var(--muted);font-size:.82rem}.btn-download{padding:13px 22px;background:linear-gradient(120deg,#d9c28f,#c8a96b);color:#06100e}.history{margin-top:28px;border-top:1px solid var(--border);padding-top:20px}.history-head{display:flex;justify-content:space-between;margin-bottom:10px}.history-head button{border:0;background:none;color:var(--accent);cursor:pointer}.history-list{display:grid;gap:8px}.history-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--input);border:1px solid var(--border);border-radius:11px}.htext{flex:1;min-width:0}.history-item strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.86rem}.history-item small,.empty{color:var(--muted)}.history-item button{border:0;background:transparent;color:var(--accent);cursor:pointer}.footer{text-align:center;border-top:1px solid var(--border);margin-top:25px;padding-top:18px;color:var(--muted);font-size:.75rem}@media(max-width:620px){body{padding:12px}.container{padding:20px 16px}.input-group{flex-direction:column}.btn-process{height:48px}.info{flex-direction:column;align-items:stretch}.btn-download{width:100%}.top{flex-wrap:wrap}}
</style>
<style>

/* TikTok / Video Tools platform header */
.platform{display:flex;align-items:center;gap:13px;min-height:76px;padding:14px 17px;margin-bottom:18px;border:1px solid #c8a96b55;border-radius:16px;text-align:left;color:var(--text);background:linear-gradient(105deg,#c8a96b1c,transparent 62%),var(--input);box-shadow:inset 0 1px #ffffff0b,0 12px 30px #0002;position:relative;overflow:hidden}
.platform:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:linear-gradient(#e5c98b,#8b9b86)}
.platform:after{content:none}
.platform-mark{display:grid;place-items:center;flex:0 0 44px;height:44px;border:1px solid #c8a96b66;border-radius:13px;background:linear-gradient(145deg,#c8a96b25,#8b9b8610);color:var(--accent);font-size:1.5rem;box-shadow:0 0 24px #c8a96b12}
.platform-copy{display:flex;flex-direction:column;gap:4px}
.platform-copy strong{font-size:1.05rem;letter-spacing:.02em}
.platform-copy small{font-size:.65rem;letter-spacing:.2em;color:var(--muted)}
.platform-live{margin-left:auto;display:flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid #8b9b8644;border-radius:999px;background:#8b9b8610;color:#a9b9a4;font-size:.63rem;font-weight:800;letter-spacing:.12em}
.platform-live i{width:6px;height:6px;border-radius:50%;background:#8b9b86;box-shadow:0 0 10px #8b9b86;animation:softPulse 1.8s ease-in-out infinite}
@media(max-width:620px){.platform{min-height:70px;padding:12px 14px}.platform-mark{flex-basis:40px;height:40px}}

/* Rellify motion layer */
body{position:relative;overflow-x:hidden;background-image:radial-gradient(ellipse at 15% 4%,#c8a96b12,transparent 34%),radial-gradient(ellipse at 90% 85%,#8b9b8610,transparent 32%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.18;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,#000,transparent 85%)}
.container{position:relative;overflow:hidden;animation:riseIn .7s cubic-bezier(.2,.7,.2,1) both;backdrop-filter:blur(18px);transition:box-shadow .3s,border-color .3s}
.container:before{content:"";position:absolute;left:10%;right:10%;top:0;height:1px;background:linear-gradient(90deg,transparent,#e5c98b99,#8b9b8688,transparent)}
.logo{position:relative;padding:12px 0 6px}
.logo:before{content:"";display:block;width:54px;height:3px;border-radius:99px;margin:0 auto 17px;background:linear-gradient(90deg,#c8a96b,#8b9b86);box-shadow:0 0 22px #c8a96b55}
.logo h1{letter-spacing:.12em;font-size:clamp(2.25rem,6vw,3.2rem);text-shadow:0 0 35px #c8a96b18}
.logo p{letter-spacing:.04em}
.platform{box-shadow:0 8px 24px #c8a96b18;transition:transform .2s,box-shadow .2s}
.platform:after{content:"  /  VIDEO TOOLS";font-size:.65rem;letter-spacing:.14em;opacity:.72;margin-left:7px}
.nav,.theme,.paste,.history-head button,.history-item button,.clear{transition:transform .18s,border-color .18s,color .18s,background .18s}
.nav:hover,.theme:hover{border-color:var(--accent);transform:translateY(-2px)}
.btn-process,.btn-download{position:relative;overflow:hidden;isolation:isolate;transition:transform .2s,box-shadow .2s,filter .2s}
.btn-process:before,.btn-download:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 20%,#ffffff55 48%,transparent 72%);transform:translateX(-130%);transition:transform .55s}
.btn-process:hover,.btn-download:hover{transform:translateY(-2px);box-shadow:0 10px 26px #c8a96b2b;filter:brightness(1.06)}
.btn-process:hover:before,.btn-download:hover:before{transform:translateX(130%)}
.input-wrap input{transition:border-color .2s,box-shadow .2s}
.input-wrap input:focus{box-shadow:0 0 0 4px #c8a96b1a}
.field select{transition:border-color .2s,box-shadow .2s;cursor:pointer}
.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #c8a96b1a}
.loading{border:1px solid var(--border);border-radius:15px;margin-top:20px;background:linear-gradient(120deg,#c8a96b08,transparent);padding:24px}
.spinner{box-shadow:0 0 22px #c8a96b18}
.progress{margin-top:17px}
.result{animation:riseIn .35s ease both}
.media-box{box-shadow:0 12px 36px #0002}
.info{gap:18px}
.title strong{font-size:1.04rem;letter-spacing:.01em}
.history-item{transition:transform .18s,border-color .18s}
.history-item:hover{transform:translateX(3px);border-color:#c8a96b88}
.history-head h2{font-size:1rem;letter-spacing:.02em}
.footer{letter-spacing:.08em}
.footer b{color:var(--accent);font-weight:700}
.startup-logo{letter-spacing:.16em}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes softPulse{0%,100%{opacity:.55}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
@media(max-width:620px){.platform:after{display:block;margin:5px 0 0}.logo{margin-bottom:20px}.container{border-radius:20px}}
</style>

<style>
/* Elegant typography system */
body{font-family:'DM Sans',sans-serif;font-optical-sizing:auto;letter-spacing:-.012em}
h1,h2,.logo h1,.startup-logo,.platform-copy strong,.title strong,.btn-process,.btn-download{font-family:'Manrope','DM Sans',sans-serif}
.logo h1{font-weight:800;letter-spacing:.075em}
.logo p{font-weight:400;letter-spacing:.015em}
.platform-copy strong{font-weight:700;letter-spacing:-.025em}
.platform-copy small{font-weight:600;letter-spacing:.22em}
.platform-live{font-family:'Manrope',sans-serif;font-weight:700;letter-spacing:.13em}
.nav,.theme,.paste,.field label,.field select,.history-item,.footer{font-family:'DM Sans',sans-serif}
.btn-process,.btn-download{font-weight:700;letter-spacing:-.015em}
.title strong,.history-item strong{font-weight:700;letter-spacing:-.02em}
.history-head h2{font-family:'Manrope',sans-serif;font-weight:700;letter-spacing:-.025em}
.startup-logo{font-weight:800;letter-spacing:.19em}
</style>

<body>
<div class="startup" id="startup"><div class="startup-inner"><div class="startup-logo">RELLIFY</div><div class="startup-spinner"></div><div class="startup-text">Rellify sedang menyiapkan halaman</div></div></div>
<div class="container"><div class="top"><button class="nav" onclick="location.href='network.html'">⌁ Network Test</button><button class="nav" onclick="location.href='games.html'">▦ Games</button><button class="theme" id="theme">◐ Mode terang</button></div><div class="logo"><h1>Rellify</h1><p>TikTok media downloader / MP4 & MP3</p></div><div class="platform" aria-label="TikTok Video Tools"><span class="platform-mark">♫</span><span class="platform-copy"><strong>TikTok</strong><small>VIDEO TOOLS</small></span><span class="platform-live"><i></i> READY</span></div><div class="input-group"><div class="input-wrap"><input id="urlInput" type="text" autocomplete="off" placeholder="Tempel URL TikTok..."><button class="clear" id="clear">×</button></div><button class="btn-process" id="btnProcess">Proses</button></div><button class="paste" id="paste">↳ Tempel dari clipboard</button><div class="options"><div class="field"><label>Format</label><select id="format"><option value="mp4">MP4 — Video</option><option value="mp3">MP3 — Audio</option></select></div></div><div class="loading" id="loading"><div class="spinner"></div><p>Memproses TikTok...</p><div class="progress"><i id="progressBar"></i></div></div><div class="error" id="error"></div><div class="result" id="result"><div class="media-box" id="mediaBox"></div><div class="info"><div class="title"><strong id="mediaTitle">TikTok</strong><span id="mediaAuthor"></span></div><button class="btn-download" id="btnDownload">Download</button></div></div><div class="history"><div class="history-head"><h2>◷ Riwayat</h2><button id="clearHistory">Hapus semua</button></div><div class="history-list" id="historyList"></div></div><div class="footer"><b>rell the dev</b></div></div>
<script>document.addEventListener('DOMContentLoaded',()=>{const $=id=>document.getElementById(id),urlInput=$('urlInput'),format=$('format'),loading=$('loading'),error=$('error'),result=$('result'),mediaBox=$('mediaBox'),mediaTitle=$('mediaTitle'),mediaAuthor=$('mediaAuthor'),btnDownload=$('btnDownload'),progress=$('progressBar');const wafRules=[{name:'XSS',re:/<\s*script|javascript\s*:|onerror\s*=|onload\s*=|<\s*(iframe|svg|img)\b/i},{name:'SQL injection',re:/(union\s+select|select\s+.+\s+from|insert\s+into|drop\s+table|or\s+['"`]?1['"`]?\s*=\s*['"`]?1|--\s)/i},{name:'Path traversal',re:/(\.\.\/|\.\.\\|%2e%2e|%252e%252e)/i},{name:'Command injection',re:/(^|[;&|])\s*(cmd|powershell|bash|sh)\b|\$\([^)]*\)|`[^`]+`/i},{name:'Template injection',re:/\$\{[^}]+\}|\{\{[^}]+\}\}/i},{name:'SSRF pattern',re:/(localhost|127\.0\.0\.1|0\.0\.0\.0|169\.254\.169\.254|\[::1\])/i},{name:'XXE pattern',re:/<!DOCTYPE[^>]*(ENTITY|SYSTEM)/i},{name:'Suspicious file path',re:/\.(?:php[0-9]?|phtml|jsp|jspx|asp|aspx)(?:[/?#]|$)/i}];const inspectText=text=>{try{text=decodeURIComponent(text)}catch{}const hit=wafRules.find(r=>r.re.test(text));if(hit&&!location.pathname.endsWith('/waf.html')){location.replace('/waf.html?detected='+encodeURIComponent(hit.name));return true}return false};inspectText(location.search+' '+location.hash);urlInput.addEventListener('input',()=>inspectText(urlInput.value));urlInput.addEventListener('paste',()=>setTimeout(()=>inspectText(urlInput.value),0));let currentUrl='',currentFilename='',currentFormat='mp4';setTimeout(()=>$('startup').classList.add('hide'),900);const validUrl=v=>{try{const u=new URL(v),h=u.hostname.toLowerCase().replace(/^www\./,'');return h==='tiktok.com'||h.endsWith('.tiktok.com')}catch{return false}};const showError=m=>{loading.style.display='none';error.textContent=m;error.classList.add('show')};const save=h=>{let a=JSON.parse(localStorage.getItem('tt_history')||'[]');a=[h,...a.filter(x=>x.url!==h.url)].slice(0,8);localStorage.setItem('tt_history',JSON.stringify(a));render()};function render(){const a=JSON.parse(localStorage.getItem('tt_history')||'[]'),l=$('historyList');if(!a.length){l.innerHTML='<div class="empty">Belum ada riwayat download.</div>';return}l.innerHTML=a.map((x,i)=>`<div class="history-item"><div class="htext"><strong>${String(x.title||'TikTok').replace(/[&<>]/g,'')}</strong><small>${x.format.toUpperCase()} • ${new Date(x.time).toLocaleString('id-ID')}</small></div><button data-i="${i}">↗</button></div>`).join('');l.querySelectorAll('button').forEach(b=>b.onclick=()=>urlInput.value=a[b.dataset.i].url)}async function processMedia(){const url=urlInput.value.trim();if(inspectText(url))return;if(!url)return showError('Masukkan URL TikTok!');if(!validUrl(url))return showError('URL TikTok tidak valid.');loading.style.display='block';error.classList.remove('show');result.style.display='none';currentFormat=format.value;progress.style.width='25%';try{const r=await fetch('/api/tiktok?'+new URLSearchParams({url,format:currentFormat})),text=await r.text();progress.style.width='65%';let d;try{d=JSON.parse(text)}catch{throw Error('API mengembalikan respons bukan JSON.')}if(!r.ok||!d.success)throw Error(d.error||'Media tidak dapat diproses.');currentUrl=d.media_url;currentFilename=d.filename||d.title||`tiktok_${Date.now()}.${currentFormat}`;mediaTitle.textContent=d.title||currentFilename;mediaAuthor.textContent=d.author||'';mediaBox.innerHTML='';if(currentFormat==='mp3'){const c=document.createElement('div');c.className='audio-card';c.innerHTML='<div class="icon">♫</div>';const a=document.createElement('audio');a.controls=true;a.src=currentUrl;c.appendChild(a);mediaBox.appendChild(c)}else{const v=document.createElement('video');v.controls=true;v.playsInline=true;v.preload='metadata';v.src=currentUrl;mediaBox.appendChild(v)}progress.style.width='100%';result.style.display='block';save({url,title:d.title||'TikTok',format:currentFormat,time:Date.now()})}catch(e){progress.style.width='0';showError(e.message||'Terjadi kesalahan.')}finally{setTimeout(()=>loading.style.display='none',250)}}async function downloadMedia(){if(!currentUrl)return;try{const r=await fetch(currentUrl);if(!r.ok)throw Error();const b=await r.blob(),o=URL.createObjectURL(b),a=document.createElement('a');a.href=o;a.download=currentFilename;a.click();setTimeout(()=>URL.revokeObjectURL(o),1000)}catch{window.open(currentUrl,'_blank')}}$('btnProcess').onclick=processMedia;btnDownload.onclick=downloadMedia;$('clear').onclick=()=>{urlInput.value='';result.style.display='none';error.classList.remove('show')};$('paste').onclick=async()=>{try{urlInput.value=await navigator.clipboard.readText();inspectText(urlInput.value)}catch{}};$('clearHistory').onclick=()=>{localStorage.removeItem('tt_history');render()};$('theme').onclick=()=>{document.body.classList.toggle('light');localStorage.setItem('tt_theme',document.body.classList.contains('light')?'light':'dark');$('theme').textContent=document.body.classList.contains('light')?'◑ Mode gelap':'◐ Mode terang'};if(localStorage.getItem('tt_theme')==='light')$('theme').click();urlInput.onkeydown=e=>{if(e.key==='Enter')processMedia()};render()});</script></body></html>
