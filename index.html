<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#08090d"><title>Rellify</title>
<style>
:root{--bg:#08090d;--card:#11131a;--input:#191c25;--border:#292d3a;--text:#fff;--muted:#858b9b;--accent:#8b5cf6;--danger:#ff9b9b}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Segoe UI,Arial,sans-serif;min-height:100vh;background:var(--bg);color:var(--text);padding:24px}body.light{--bg:#f3f4f6;--card:#fff;--input:#f1f3f6;--border:#d8dce5;--text:#111827;--muted:#667085}.startup{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;transition:.5s}.startup.hide{opacity:0;visibility:hidden}.startup-inner{text-align:center}.startup-logo{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#ff0050,#8b5cf6,#00d9ff);-webkit-background-clip:text;color:transparent}.startup-spinner,.spinner{width:42px;height:42px;margin:22px auto 12px;border:4px solid #282c37;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.startup-text{color:var(--muted);font-size:.85rem}.container{max-width:820px;margin:auto;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:30px;box-shadow:0 24px 70px #0007}.top{display:flex;justify-content:flex-end;gap:8px;margin-bottom:18px}.nav,.theme{border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer}.logo{text-align:center;margin-bottom:26px}.logo h1{font-size:2.5rem;background:linear-gradient(135deg,#ff0050,#8b5cf6,#00d9ff);-webkit-background-clip:text;color:transparent}.logo p{margin-top:8px;color:var(--muted);font-size:.9rem}.platform{width:100%;border:1px solid #303442;background:linear-gradient(135deg,#ff0050,#7c3aed);color:#fff;border-radius:13px;padding:13px;font-weight:700;margin-bottom:15px}.input-group{display:flex;gap:10px}.input-wrap{position:relative;flex:1}.input-wrap input{width:100%;height:52px;background:var(--input);color:var(--text);border:2px solid var(--border);border-radius:13px;padding:0 45px 0 16px;outline:none}.input-wrap input:focus{border-color:var(--accent)}.clear{position:absolute;right:8px;top:8px;height:36px;width:36px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:20px}.btn-process,.btn-download{border:0;border-radius:13px;color:#fff;font-weight:800;cursor:pointer}.btn-process{min-width:120px;background:linear-gradient(135deg,#7c3aed,#2563eb)}.paste{margin-top:9px;border:0;background:none;color:var(--accent);cursor:pointer;font-size:.82rem}.options{display:flex;margin-top:14px}.field{flex:1}.field label{display:block;color:var(--muted);font-size:.78rem;margin-bottom:7px}.field select{width:100%;background:var(--input);color:var(--text);border:1px solid var(--border);border-radius:11px;padding:12px}.loading{display:none;text-align:center;padding:25px 0;color:var(--muted)}.spinner{width:38px;height:38px}.progress{height:7px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:13px}.progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,#ff0050,#8b5cf6,#00d9ff);transition:.25s}.error{display:none;margin-top:18px;padding:14px 16px;border:1px solid #7f1d1d;background:#2a1116;color:var(--danger);border-radius:12px}.error.show{display:block}.result{display:none;margin-top:24px}.thumb{width:100%;max-height:380px;object-fit:cover;border-radius:15px;margin-bottom:14px}.media-box{background:#090b10;border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:15px}.media-box video,.media-box audio{width:100%;display:block}.media-box video{max-height:560px}.audio-card{padding:24px}.audio-card .icon{text-align:center;font-size:2.5rem;margin-bottom:12px}.info{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 0;border-top:1px solid var(--border)}.title{min-width:0;flex:1}.title strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title span{display:block;margin-top:4px;color:var(--muted);font-size:.82rem}.btn-download{padding:13px 22px;background:linear-gradient(135deg,#00d9a5,#00b8d9);color:#06100e}.history{margin-top:28px;border-top:1px solid var(--border);padding-top:20px}.history-head{display:flex;justify-content:space-between;margin-bottom:10px}.history-head button{border:0;background:none;color:var(--accent);cursor:pointer}.history-list{display:grid;gap:8px}.history-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--input);border:1px solid var(--border);border-radius:11px}.history-item img{width:48px;height:48px;object-fit:cover;border-radius:8px}.htext{flex:1;min-width:0}.history-item strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.86rem}.history-item small,.empty{color:var(--muted)}.history-item button{border:0;background:transparent;color:var(--accent);cursor:pointer}.footer{text-align:center;border-top:1px solid var(--border);margin-top:25px;padding-top:18px;color:var(--muted);font-size:.75rem}@media(max-width:620px){body{padding:12px}.container{padding:20px 16px}.input-group{flex-direction:column}.btn-process{height:48px}.info{flex-direction:column;align-items:stretch}.btn-download{width:100%}.top{flex-wrap:wrap}}
</style></head>
<body>
<div class="startup" id="startup"><div class="startup-inner"><div class="startup-logo">Rellify</div><div class="startup-spinner"></div><div class="startup-text">what's sup bro,webnya lagi loading</div></div></div>
<div class="container"><div class="top"><button class="nav" onclick="location.href='network.html'">📶 Network Test</button><button class="nav" onclick="location.href='games.html'">🎮 Games</button><button class="nav" onclick="location.href='waf.html'">🛡️ WAF</button><button class="theme" id="theme">☀️ Mode terang</button></div><div class="logo"><h1>Rellify</h1><p>TikTok Downloader • MP4 & MP3</p></div><button class="platform">♪ TikTok</button><div class="input-group"><div class="input-wrap"><input id="urlInput" type="text" autocomplete="off" placeholder="Tempel URL TikTok..."><button class="clear" id="clear">×</button></div><button class="btn-process" id="btnProcess">Proses</button></div><button class="paste" id="paste">📋 Paste dari clipboard</button><div class="options"><div class="field"><label>Format</label><select id="format"><option value="mp4">MP4 — Video</option><option value="mp3">MP3 — Audio</option></select></div></div><div class="loading" id="loading"><div class="spinner"></div><p>Memproses TikTok...</p><div class="progress"><i id="progressBar"></i></div></div><div class="error" id="error"></div><div class="result" id="result"><img class="thumb" id="thumb" style="display:none"><div class="media-box" id="mediaBox"></div><div class="info"><div class="title"><strong id="mediaTitle">TikTok</strong><span id="mediaAuthor"></span></div><button class="btn-download" id="btnDownload">Download</button></div></div><div class="history"><div class="history-head"><h2>🕘 Riwayat</h2><button id="clearHistory">Hapus semua</button></div><div class="history-list" id="historyList"></div></div><div class="footer"><b>rell the dev</b></div></div>
<script>document.addEventListener('DOMContentLoaded',()=>{const $=id=>document.getElementById(id),urlInput=$('urlInput'),format=$('format'),loading=$('loading'),error=$('error'),result=$('result'),mediaBox=$('mediaBox'),thumb=$('thumb'),mediaTitle=$('mediaTitle'),mediaAuthor=$('mediaAuthor'),btnDownload=$('btnDownload'),progress=$('progressBar');const wafRules=[{name:'XSS',re:/<\s*script|javascript\s*:|onerror\s*=|onload\s*=|<\s*(iframe|svg|img)\b/i},{name:'SQL injection',re:/(union\s+select|select\s+.+\s+from|insert\s+into|drop\s+table|or\s+['"`]?1['"`]?\s*=\s*['"`]?1|--\s)/i},{name:'Path traversal',re:/(\.\.\/|\.\.\\|%2e%2e|%252e%252e)/i},{name:'Command injection',re:/(^|[;&|])\s*(cmd|powershell|bash|sh)\b|\$\([^)]*\)|`[^`]+`/i},{name:'Template injection',re:/\$\{[^}]+\}|\{\{[^}]+\}\}/i}];const inspectLocation=()=>{const text=decodeURIComponent(location.search+' '+location.hash);const hit=wafRules.find(r=>r.re.test(text));if(hit&&!location.pathname.endsWith('/waf.html'))location.replace('/waf.html?detected='+encodeURIComponent(hit.name))};try{inspectLocation()}catch{}let currentUrl='',currentFilename='',currentFormat='mp4';setTimeout(()=>$('startup').classList.add('hide'),900);const validUrl=v=>{try{const u=new URL(v),h=u.hostname.toLowerCase().replace(/^www\./,'');return h==='tiktok.com'||h.endsWith('.tiktok.com')}catch{return false}};const showError=m=>{loading.style.display='none';error.textContent=m;error.classList.add('show')};const save=h=>{let a=JSON.parse(localStorage.getItem('tt_history')||'[]');a=[h,...a.filter(x=>x.url!==h.url)].slice(0,8);localStorage.setItem('tt_history',JSON.stringify(a));render()};function render(){const a=JSON.parse(localStorage.getItem('tt_history')||'[]'),l=$('historyList');if(!a.length){l.innerHTML='<div class="empty">Belum ada riwayat download.</div>';return}l.innerHTML=a.map((x,i)=>`<div class="history-item">${x.thumb?`<img src="${x.thumb}">`:''}<div class="htext"><strong>${String(x.title||'TikTok').replace(/[&<>]/g,'')}</strong><small>${x.format.toUpperCase()} • ${new Date(x.time).toLocaleString('id-ID')}</small></div><button data-i="${i}">↗</button></div>`).join('');l.querySelectorAll('button').forEach(b=>b.onclick=()=>urlInput.value=a[b.dataset.i].url)}async function processMedia(){const url=urlInput.value.trim();if(!url)return showError('Masukkan URL TikTok!');if(!validUrl(url))return showError('itu url apa dawg🥀');loading.style.display='block';error.classList.remove('show');result.style.display='none';currentFormat=format.value;progress.style.width='25%';try{const r=await fetch('/api/tiktok?'+new URLSearchParams({url,format:currentFormat})),text=await r.text();progress.style.width='65%';let d;try{d=JSON.parse(text)}catch{throw Error('API mengembalikan respons bukan JSON.')}if(!r.ok||!d.success)throw Error(d.error||'Media tidak dapat diproses.');currentUrl=d.media_url;currentFilename=d.filename||d.title||`tiktok_${Date.now()}.${currentFormat}`;mediaTitle.textContent=d.title||currentFilename;mediaAuthor.textContent=d.author||'';thumb.style.display=d.thumbnail?'block':'none';if(d.thumbnail)thumb.src=d.thumbnail;mediaBox.innerHTML='';if(currentFormat==='mp3'){const c=document.createElement('div');c.className='audio-card';c.innerHTML='<div class="icon">🎵</div>';const a=document.createElement('audio');a.controls=true;a.src=currentUrl;c.appendChild(a);mediaBox.appendChild(c)}else{const v=document.createElement('video');v.controls=true;v.playsInline=true;v.src=currentUrl;mediaBox.appendChild(v)}progress.style.width='100%';result.style.display='block';save({url,title:d.title||'TikTok',format:currentFormat,thumb:d.thumbnail||'',time:Date.now()})}catch(e){progress.style.width='0';showError(e.message||'Terjadi kesalahan.')}finally{setTimeout(()=>loading.style.display='none',250)}}async function downloadMedia(){if(!currentUrl)return;try{const r=await fetch(currentUrl);if(!r.ok)throw Error();const b=await r.blob(),o=URL.createObjectURL(b),a=document.createElement('a');a.href=o;a.download=currentFilename;a.click();setTimeout(()=>URL.revokeObjectURL(o),1000)}catch{window.open(currentUrl,'_blank')}}$('btnProcess').onclick=processMedia;btnDownload.onclick=downloadMedia;$('clear').onclick=()=>{urlInput.value='';result.style.display='none';error.classList.remove('show')};$('paste').onclick=async()=>{try{urlInput.value=await navigator.clipboard.readText()}catch{}};$('clearHistory').onclick=()=>{localStorage.removeItem('tt_history');render()};$('theme').onclick=()=>{document.body.classList.toggle('light');localStorage.setItem('tt_theme',document.body.classList.contains('light')?'light':'dark');$('theme').textContent=document.body.classList.contains('light')?'🌙 Mode gelap':'☀️ Mode terang'};if(localStorage.getItem('tt_theme')==='light')$('theme').click();urlInput.onkeydown=e=>{if(e.key==='Enter')processMedia()};render()});</script></body></html>
