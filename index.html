<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Downloader</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Segoe UI,Arial,sans-serif;min-height:100vh;background:#08090d;color:#fff;display:flex;justify-content:center;align-items:center;padding:24px}.container{width:100%;max-width:780px;background:#11131a;border:1px solid #242733;border-radius:24px;padding:34px;box-shadow:0 24px 70px rgba(0,0,0,.45)}.logo{text-align:center;margin-bottom:28px}.logo h1{font-size:2.2rem;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,#ff0050,#8b5cf6,#00d9ff);-webkit-background-clip:text;background-clip:text;color:transparent}.logo p{margin-top:8px;color:#858b9b;font-size:.9rem}.input-group{display:flex;gap:10px}.input-group input{flex:1;min-width:0;background:#191c25;color:#fff;border:2px solid #2a2e3a;border-radius:13px;padding:15px 17px;font-size:.95rem;outline:none}.input-group input:focus{border-color:#7c3aed}.btn-process{border:0;border-radius:13px;padding:0 25px;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;font-weight:800;cursor:pointer;min-width:115px}.btn-process:disabled{opacity:.6;cursor:wait}.options{margin-top:14px}.field label{display:block;color:#858b9b;font-size:.78rem;margin-bottom:7px}.field select{width:100%;background:#191c25;color:#fff;border:1px solid #2a2e3a;border-radius:11px;padding:12px;outline:none}.loading{display:none;text-align:center;padding:28px 0;color:#9ca3af}.spinner{width:38px;height:38px;margin:0 auto 12px;border:4px solid #282c37;border-top-color:#8b5cf6;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error{display:none;margin-top:18px;padding:14px 16px;border:1px solid #7f1d1d;background:#2a1116;color:#ff9b9b;border-radius:12px}.error.show{display:block}.result{display:none;margin-top:24px}.media-box{background:#090b10;border:1px solid #252936;border-radius:16px;overflow:hidden;margin-bottom:15px}.media-box video,.media-box audio{width:100%;display:block}.media-box video{max-height:560px}.audio-card{padding:24px}.audio-card .icon{font-size:2.5rem;text-align:center;margin-bottom:12px}.info{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 0;border-top:1px solid #252936}.title{min-width:0;flex:1}.title strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title span{display:block;margin-top:4px;color:#858b9b;font-size:.82rem}.btn-download{border:0;border-radius:12px;padding:13px 22px;background:linear-gradient(135deg,#00d9a5,#00b8d9);color:#06100e;font-weight:800;cursor:pointer;white-space:nowrap}.btn-download:disabled{opacity:.6;cursor:wait}.footer{text-align:center;border-top:1px solid #20232d;margin-top:25px;padding-top:18px;color:#5f6675;font-size:.75rem;line-height:1.5}.footer b{color:#8b93a3}@media(max-width:620px){body{padding:12px}.container{padding:23px 18px;border-radius:19px}.logo h1{font-size:1.8rem}.input-group{flex-direction:column}.btn-process{height:48px}.info{align-items:stretch;flex-direction:column}.btn-download{width:100%}}
</style>
</head>
<body>
<div class="container"><div class="logo"><h1>TikTok Downloader</h1><p>MP4 & MP3 • Simple & Fast</p></div><div class="input-group"><input id="urlInput" type="text" autocomplete="off" placeholder="Tempel URL TikTok..."><button class="btn-process" id="btnProcess">Proses</button></div><div class="options"><div class="field"><label for="format">Format</label><select id="format"><option value="mp4">MP4 — Video</option><option value="mp3">MP3 — Audio</option></select></div></div><div class="loading" id="loading"><div class="spinner"></div><p id="loadingText">Memproses TikTok...</p></div><div class="error" id="error"></div><div class="result" id="result"><div class="media-box" id="mediaBox"></div><div class="info"><div class="title"><strong id="mediaTitle">TikTok</strong><span id="mediaAuthor"></span></div><button class="btn-download" id="btnDownload">Download</button></div></div><div class="footer"><b>Gunakan hanya untuk konten yang kamu miliki atau punya izin untuk mengunduh.</b><br>Downloader ini tidak dimaksudkan untuk mengakali pembatasan platform.</div></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{const $=id=>document.getElementById(id),urlInput=$('urlInput'),format=$('format'),btnProcess=$('btnProcess'),loading=$('loading'),loadingText=$('loadingText'),error=$('error'),result=$('result'),mediaBox=$('mediaBox'),mediaTitle=$('mediaTitle'),mediaAuthor=$('mediaAuthor'),btnDownload=$('btnDownload');let currentUrl='',currentFilename='',currentFormat='mp4';function showError(message){loading.style.display='none';error.textContent='⚠️ '+message;error.classList.add('show')}async function processMedia(){const url=urlInput.value.trim();if(!url)return showError('Masukkan URL TikTok!');try{const u=new URL(url),host=u.hostname.toLowerCase().replace(/^www\./,'');if(host!=='tiktok.com'&&!host.endsWith('.tiktok.com'))return showError('URL TikTok tidak valid.')}catch{return showError('URL TikTok tidak valid.')}loading.style.display='block';loadingText.textContent='Memproses TikTok...';error.classList.remove('show');result.style.display='none';btnProcess.disabled=true;btnProcess.textContent='...';currentFormat=format.value;try{const params=new URLSearchParams({url,format:currentFormat});const response=await fetch(`/api/tiktok?${params.toString()}`);const text=await response.text();let data;try{data=JSON.parse(text)}catch{throw new Error(`API mengembalikan respons bukan JSON (${response.status}).`)}if(!response.ok||!data.success)throw new Error(data.error||'TikTok tidak dapat diproses.');currentUrl=data.media_url||data.video_url||data.audio_url||data.url;currentFilename=data.filename||data.title||`tiktok_${Date.now()}.${currentFormat}`;if(!currentUrl)throw new Error(currentFormat==='mp3'?'URL audio tidak tersedia.':'URL media tidak tersedia.');mediaTitle.textContent=data.title||currentFilename;mediaAuthor.textContent=data.author||'';mediaBox.innerHTML='';if(currentFormat==='mp3'){const card=document.createElement('div');card.className='audio-card';card.innerHTML='<div class="icon">🎵</div>';const audio=document.createElement('audio');audio.controls=true;audio.preload='metadata';audio.src=currentUrl;card.appendChild(audio);mediaBox.appendChild(card)}else{const video=document.createElement('video');video.controls=true;video.playsInline=true;video.preload='metadata';video.src=currentUrl;mediaBox.appendChild(video)}result.style.display='block'}catch(err){showError(err.message||'Terjadi kesalahan.')}finally{loading.style.display='none';btnProcess.disabled=false;btnProcess.textContent='Proses'}}async function downloadMedia(){if(!currentUrl)return;btnDownload.disabled=true;btnDownload.textContent='Menyiapkan...';try{const response=await fetch(currentUrl);if(!response.ok)throw new Error();const blob=await response.blob(),objectUrl=URL.createObjectURL(blob),a=document.createElement('a');a.href=objectUrl;a.download=currentFilename||`tiktok_${Date.now()}.${currentFormat}`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(objectUrl),1000)}catch{window.open(currentUrl,'_blank','noopener,noreferrer')}finally{btnDownload.disabled=false;btnDownload.textContent='Download'}}btnProcess.addEventListener('click',processMedia);btnDownload.addEventListener('click',downloadMedia);urlInput.addEventListener('keydown',e=>{if(e.key==='Enter')processMedia()})});
</script></body></html>
