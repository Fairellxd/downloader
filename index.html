<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#08090d"><title>TikTok Downloader</title>
<style>
:root{--bg:#08090d;--card:#11131a;--input:#191c25;--border:#292d3a;--text:#fff;--muted:#858b9b;--accent:#8b5cf6;--danger:#ff9b9b}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Segoe UI,Arial,sans-serif;min-height:100vh;background:var(--bg);color:var(--text);padding:24px;transition:.3s}body.light{--bg:#f3f4f6;--card:#fff;--input:#f1f3f6;--border:#d8dce5;--text:#111827;--muted:#667085}button,select,input{font:inherit}.startup{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s,visibility .5s}.startup.hide{opacity:0;visibility:hidden}.startup-inner{text-align:center}.startup-logo{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#ff0050,#8b5cf6,#00d9ff);-webkit-background-clip:text;color:transparent}.startup-spinner,.spinner{width:42px;height:42px;margin:22px auto 12px;border:4px solid #282c37;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.startup-text{color:var(--muted);font-size:.85rem}.container{width:100%;max-width:820px;margin:auto;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:30px;box-shadow:0 24px 70px #0007;animation:up .45s ease}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.top{display:flex;justify-content:flex-end;margin-bottom:8px}.theme{border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:10px;padding:8px 11px;cursor:pointer}.logo{text-align:center;margin-bottom:26px}.logo h1{font-size:2.2rem;letter-spacing:-1px;background:linear-gradient(135deg,#ff0050,#8b5cf6,#00d9ff);-webkit-background-clip:text;color:transparent}.logo p{margin-top:8px;color:var(--muted);font-size:.9rem}.platform{width:100%;border:1px solid #303442;background:linear-gradient(135deg,#ff0050,#7c3aed);color:#fff;border-radius:13px;padding:13px;font-weight:700;margin-bottom:15px}.input-group{display:flex;gap:10px}.input-wrap{position:relative;flex:1}.input-wrap input{width:100%;height:52px;background:var(--input);color:var(--text);border:2px solid var(--border);border-radius:13px;padding:0 45px 0 16px;outline:none}.input-wrap input:focus{border-color:var(--accent)}.clear{position:absolute;right:8px;top:8px;height:36px;width:36px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;font-size:20px}.btn-process,.btn-download{border:0;border-radius:13px;color:#fff;font-weight:800;cursor:pointer;transition:transform .15s,filter .15s}.btn-process{min-width:120px;background:linear-gradient(135deg,#7c3aed,#2563eb)}.btn-process:hover,.btn-download:hover,.theme:hover{transform:translateY(-1px);filter:brightness(1.08)}.paste{margin-top:9px;border:0;background:none;color:var(--accent);cursor:pointer;font-size:.82rem}.options{display:flex;gap:10px;margin-top:14px}.field{flex:1}.field label{display:block;color:var(--muted);font-size:.78rem;margin-bottom:7px}.field select{width:100%;background:var(--input);color:var(--text);border:1px solid var(--border);border-radius:11px;padding:12px;outline:none}.loading{display:none;text-align:center;padding:25px 0;color:var(--muted)}.spinner{width:38px;height:38px;margin:0 auto 12px}.progress{height:7px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:13px}.progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,#ff0050,#8b5cf6,#00d9ff);transition:width .25s}.error{display:none;margin-top:18px;padding:14px 16px;border:1px solid #7f1d1d;background:#2a1116;color:var(--danger);border-radius:12px}.error.show{display:block}.result{display:none;margin-top:24px}.thumb{width:100%;max-height:380px;object-fit:cover;border-radius:15px;margin-bottom:14px;background:#090b10}.media-box{background:#090b10;border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:15px}.media-box video,.media-box audio{width:100%;display:block}.media-box video{max-height:560px}.audio-card{padding:24px}.audio-card .icon{font-size:2.5rem;text-align:center;margin-bottom:12px}.info{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 0;border-top:1px solid var(--border)}.title{min-width:0;flex:1}.title strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title span{display:block;margin-top:4px;color:var(--muted);font-size:.82rem}.btn-download{padding:13px 22px;background:linear-gradient(135deg,#00d9a5,#00b8d9);color:#06100e;white-space:nowrap}.history{margin-top:28px;border-top:1px solid var(--border);padding-top:20px}.history-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.history-head h2{font-size:1rem}.history-head button{border:0;background:none;color:var(--accent);cursor:pointer}.history-list{display:grid;gap:8px}.history-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--input);border:1px solid var(--border);border-radius:11px}.history-item img{width:48px;height:48px;object-fit:cover;border-radius:8px;background:#222}.history-item .htext{flex:1;min-width:0}.history-item strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.86rem}.history-item small{color:var(--muted)}.history-item button{border:0;background:transparent;color:var(--accent);cursor:pointer}.empty{color:var(--muted);font-size:.82rem}.toast{position:fixed;right:20px;bottom:20px;background:#191c25;color:#fff;border:1px solid #343949;border-radius:12px;padding:12px 16px;box-shadow:0 10px 30px #0006;opacity:0;transform:translateY(12px);pointer-events:none;transition:.25s;z-index:10000}.toast.show{opacity:1;transform:none}.footer{text-align:center;border-top:1px solid var(--border);margin-top:25px;padding-top:18px;color:var(--muted);font-size:.75rem}@media(max-width:620px){body{padding:12px}.container{padding:20px 16px;border-radius:19px}.logo h1{font-size:1.8rem}.input-group{flex-direction:column}.btn-process{height:48px}.options{flex-direction:column}.info{align-items:stretch;flex-direction:column}.btn-download{width:100%}.toast{left:12px;right:12px;bottom:12px;text-align:center}}
</style></head>
<body>
<div class="startup" id="startup"><div class="startup-inner"><div class="startup-logo">TikTok Downloader</div><div class="startup-spinner"></div><div class="startup-text">what's sup bro,webnya lagi loading</div></div></div>
<div class="container"><div class="top"><button class="theme" id="theme">☀️ Mode terang</button></div><div class="logo"><h1>TikTok Downloader</h1><p>Download TikTok dalam format MP4 & MP3</p></div><button class="platform">♪ TikTok</button><div class="input-group"><div class="input-wrap"><input id="urlInput" type="text" autocomplete="off" placeholder="Tempel URL TikTok..."><button class="clear" id="clear" title="Hapus">×</button></div><button class="btn-process" id="btnProcess">Proses</button></div><button class="paste" id="paste">📋 Paste dari clipboard</button><div class="options"><div class="field"><label for="format">Format</label><select id="format"><option value="mp4">MP4 — Video</option><option value="mp3">MP3 — Audio</option></select></div></div><div class="loading" id="loading"><div class="spinner"></div><p id="loadingText">Memproses TikTok...</p><div class="progress"><i id="progressBar"></i></div></div><div class="error" id="error"></div><div class="result" id="result"><img class="thumb" id="thumb" alt="Thumbnail TikTok" style="display:none"><div class="media-box" id="mediaBox"></div><div class="info"><div class="title"><strong id="mediaTitle">TikTok</strong><span id="mediaAuthor"></span></div><button class="btn-download" id="btnDownload">Download</button></div></div><div class="history"><div class="history-head"><h2>🕘 Riwayat</h2><button id="clearHistory">Hapus semua</button></div><div class="history-list" id="historyList"></div></div><div class="footer"><b>rell the dev</b></div></div><div class="toast" id="toast"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{const $=id=>document.getElementById(id),startup=$('startup'),urlInput=$('urlInput'),format=$('format'),btnProcess=$('btnProcess'),loading=$('loading'),loadingText=$('loadingText'),progressBar=$('progressBar'),error=$('error'),result=$('result'),mediaBox=$('mediaBox'),thumb=$('thumb'),mediaTitle=$('mediaTitle'),mediaAuthor=$('mediaAuthor'),btnDownload=$('btnDownload'),toast=$('toast');setTimeout(()=>startup.classList.add('hide'),900);let currentUrl='',currentFilename='',currentFormat='mp4',timer;
function notify(m){toast.textContent=m;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),2200)}function showError(m){loading.style.display='none';error.textContent=m;error.classList.add('show')}function validUrl(v){try{const u=new URL(v),h=u.hostname.toLowerCase().replace(/^www\\./,'');return h==='tiktok.com'||h.endsWith('.tiktok.com')}catch{return false}}
function setProgress(n){progressBar.style.width=n+'%'}function saveHistory(item){let h=JSON.parse(localStorage.getItem('tt_history')||'[]');h=[item,...h.filter(x=>x.url!==item.url)].slice(0,8);localStorage.setItem('tt_history',JSON.stringify(h));renderHistory()}function renderHistory(){const list=$('historyList'),h=JSON.parse(localStorage.getItem('tt_history')||'[]');if(!h.length){list.innerHTML='<div class="empty">Belum ada riwayat download.</div>';return}list.innerHTML='';h.forEach((x,i)=>{const d=document.createElement('div');d.className='history-item';d.innerHTML=`${x.thumb?`<img src="${x.thumb}" alt="">`:''}<div class="htext"><strong>${escapeHtml(x.title||'TikTok')}</strong><small>${x.format.toUpperCase()} • ${new Date(x.time).toLocaleString('id-ID')}</small></div><button data-i="${i}">↗</button>`;d.querySelector('button').onclick=()=>{urlInput.value=x.url;notify('URL riwayat dimuat')};list.appendChild(d)})}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function processMedia(){const url=urlInput.value.trim();if(!url)return showError('Masukkan URL TikTok!');if(!validUrl(url))return showError('itu url apa dawg🥀');loading.style.display='block';loadingText.textContent=`Memproses TikTok ${format.value.toUpperCase()}...`;error.classList.remove('show');result.style.display='none';btnProcess.disabled=true;btnProcess.textContent='...';currentFormat=format.value;setProgress(12);try{const params=new URLSearchParams({url,format:currentFormat});setProgress(30);const response=await fetch(`/api/tiktok?${params.toString()}`),text=await response.text();setProgress(62);let data;try{data=JSON.parse(text)}catch{throw new Error(`API mengembalikan respons bukan JSON (${response.status}).`)}if(!response.ok||!data.success)throw new Error(data.error||'Media tidak dapat diproses.');currentUrl=data.media_url||data.url||data.audio_url||data.video_url;currentFilename=data.filename||data.title||`tiktok_${Date.now()}.${currentFormat}`;if(!currentUrl)throw new Error(currentFormat==='mp3'?'URL audio tidak tersedia.':'URL video tidak tersedia.');mediaTitle.textContent=data.title||currentFilename;mediaAuthor.textContent=data.author||'';thumb.style.display=data.thumbnail?'block':'none';if(data.thumbnail)thumb.src=data.thumbnail;mediaBox.innerHTML='';if(currentFormat==='mp3'){const card=document.createElement('div');card.className='audio-card';card.innerHTML='<div class="icon">🎵</div>';const audio=document.createElement('audio');audio.controls=true;audio.preload='metadata';audio.src=currentUrl;card.appendChild(audio);mediaBox.appendChild(card)}else{const video=document.createElement('video');video.controls=true;video.playsInline=true;video.preload='metadata';video.src=currentUrl;mediaBox.appendChild(video)}setProgress(100);result.style.display='block';saveHistory({url,title:data.title||'TikTok',author:data.author||'',format:currentFormat,thumb:data.thumbnail||'',time:Date.now()});notify('Media berhasil diproses ✓')}catch(e){setProgress(0);showError(e.message||'Terjadi kesalahan.')}finally{loading.style.display='none';btnProcess.disabled=false;btnProcess.textContent='Proses'}}
async function downloadMedia(){if(!currentUrl)return;btnDownload.disabled=true;btnDownload.textContent='Menyiapkan...';try{const r=await fetch(currentUrl);if(!r.ok)throw new Error();const b=await r.blob(),o=URL.createObjectURL(b),a=document.createElement('a');a.href=o;a.download=currentFilename||`tiktok_${Date.now()}.${currentFormat}`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(o),1000);notify('Download dimulai ✓')}catch{window.open(currentUrl,'_blank','noopener,noreferrer');notify('Membuka media...')}finally{btnDownload.disabled=false;btnDownload.textContent='Download'}}
$('clear').onclick=()=>{urlInput.value='';urlInput.focus();result.style.display='none';error.classList.remove('show')};$('paste').onclick=async()=>{try{urlInput.value=await navigator.clipboard.readText();notify('URL berhasil dipaste')}catch{notify('Clipboard tidak bisa diakses')}};$('clearHistory').onclick=()=>{localStorage.removeItem('tt_history');renderHistory();notify('Riwayat dihapus')};$('theme').onclick=()=>{document.body.classList.toggle('light');const light=document.body.classList.contains('light');localStorage.setItem('tt_theme',light?'light':'dark');$('theme').textContent=light?'🌙 Mode gelap':'☀️ Mode terang'};if(localStorage.getItem('tt_theme')==='light'){$('theme').click()}format.onchange=()=>{error.classList.remove('show');result.style.display='none'};btnProcess.onclick=processMedia;btnDownload.onclick=downloadMedia;urlInput.onkeydown=e=>{if(e.key==='Enter')processMedia()};urlInput.onpaste=()=>setTimeout(()=>{if(validUrl(urlInput.value.trim()))notify('URL TikTok terdeteksi ✓')},100);renderHistory()});
</script></body></html>
